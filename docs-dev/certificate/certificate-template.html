<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Шаблон сертификата участника диктанта</title>
<!--
  ШАБЛОН СЕРТИФИКАТА УЧАСТНИКА (ТЗ: «фон сертификата загружается как jpg,
  тексты формируются скриптом (разметка html + css)»).

  Как работает генерация в бою:
  1. Сервер подставляет в span[data-field] значения участника
     (ФИО, балл, регистрационный номер) из JSON (см. fields.json).
  2. Страница печатается в PDF размером ровно 297×210 мм
     (@page ниже) – например, Chromium: --print-to-pdf --no-pdf-header-footer.
  3. Фон – certificate-bg.jpg (300 dpi, 5834×4125 px) подложен через object-fit:cover.

  ПЕРЕМЕННЫЕ ДАННЫХ (data-field):
    fio1 – фамилия (капсом)
    fio2 – имя (капсом)
    fio3 – отчество (капсом; если нет отчества – пустая строка)
    score – итоговый балл 0–30
    regnum – ровно 6 цифр ID с добивкой нулями, без префикса
             «ПА/НОТА-26/» – он уже нанесён на фоне

  ШРИФТЫ (по макету дизайнера; файлы лежат рядом в папке fonts/,
  подключены через @font-face – при генерации PDF применяются именно они):
    ФИО:               Unbounded Medium, кегль 40 px при 150 dpi (≈19 pt)
    Итоговый балл:     Unbounded Medium, кегль 100 px при 150 dpi (≈48 pt)
    Регистрационный №: Manrope SemiBold, кегль 15 px при 150 dpi (≈7 pt)
  Перенос на сервер: скопируйте папку fonts/ рядом с шаблоном
  (пути в @font-face относительные) либо замените src на URL из MEDIALibrary.

  ДЕМО: по умолчанию показаны демонстрационные значения, а поверх
  плейсхолдеров фона («Фамилия Имя Отчество», «XX», «XXXXXX») лежат маски
  в цвет фона. Для боя плейсхолдеры отсутствуют в чистом фоне – маски
  выключаются параметром ?clean любым способом: сервер просто НЕ рендерит
  div.cover, либо добавьте ?clean для скрытия масок стилем.
-->
<style>
  @page { size: 297mm 210mm; margin: 0; }
  /* ── Шрифты макета (файлы рядом, в папке fonts/) ── */
  @font-face {
    font-family: 'Unbounded Cert';
    src: url('fonts/Unbounded-Medium.ttf') format('truetype');
    font-weight: 500; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Manrope Cert SB';
    src: url('fonts/Manrope-SemiBold.ttf') format('truetype');
    font-weight: 600; font-style: normal; font-display: swap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 297mm; height: 210mm; }
  body { font-family: 'Manrope', 'Arial Narrow', Arial, sans-serif; }
  .cert { position: relative; width: 297mm; height: 210mm; overflow: hidden; }
  .cert__bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* маски-заплатки в цвет фона (только для демо-файла с плейсхолдерами) */
  .cover { position: absolute; display: flex; align-items: center; }
  .cover--light { background: #fbfcf7; }   /* правая часть */
  .cover--navy  { background: #0d2a66; }   /* левая панель */
  .clean .cover { display: none; }

  .field { position: absolute; text-transform: uppercase; }
  /* ФИО: три строки, тёмно-синее по светлому; шрифт макета – Unbounded Medium */
  .field--fio { font-family: 'Unbounded Cert', 'Unbounded', 'Arial', sans-serif; font-weight: 500;
    color: #0d2a66; font-size: 19pt; letter-spacing: .035em; line-height: 1; left: 115mm; width: 118mm; }
  .field--fio1 { top: 81.2mm; }
  .field--fio2 { top: 92.2mm; }
  .field--fio3 { top: 102.6mm; }
  /* итоговый балл: белое по тёмно-синему, крупно; Unbounded Medium */
  .field--score { font-family: 'Unbounded Cert', 'Unbounded', 'Arial', sans-serif; font-weight: 500;
    color: #ffffff; font-size: 48pt; line-height: 1; letter-spacing: .01em; left: 13.2mm; top: 166mm; }
  /* регистрационный номер: 6 цифр после напечатанного «ПА/НОТА-26/»; Manrope SemiBold */
  .field--regnum { font-family: 'Manrope Cert SB', 'Manrope', 'Arial', sans-serif; font-weight: 600;
    color: #ffffff; font-size: 7pt; letter-spacing: .1em; left: 36.35mm; top: 197.2mm; }

  /* маски поверх плейсдолеров фона (пиксельные координаты → мм, см. fields.json) */
  .cover--fio1 { left: 113.4mm; top: 80.6mm; width: 62mm; height: 11.3mm; }
  .cover--fio2 { left: 113.4mm; top: 91.8mm; width: 62mm; height: 10.7mm; }
  .cover--fio3 { left: 113.4mm; top: 102.2mm; width: 62mm; height: 10mm; }
  .cover--score { left: 12.6mm; top: 164.6mm; width: 40mm; height: 19mm; }
  /* закрываем только XXXXXX, напечатанный префикс ПА/НОТА-26/ остаётся */
  .cover--regnum { left: 36.15mm; top: 196.6mm; width: 13.75mm; height: 5.2mm; }
</style>
</head>
<body>
  <!-- добавьте class="clean" для боевого чистого фона без плейсхолдеров -->
  <div class="cert" id="cert">
    <img class="cert__bg" src="certificate-bg.jpg" alt="">

    <!-- маски на плейсхолдеры исходного макета (демо) -->
    <div class="cover cover--light cover--fio1"></div>
    <div class="cover cover--light cover--fio2"></div>
    <div class="cover cover--light cover--fio3"></div>
    <div class="cover cover--navy cover--score"></div>
    <div class="cover cover--navy cover--regnum"></div>

    <!-- переменные данные: сервер подставляет значения внутрь span -->
    <span class="field field--fio field--fio1" data-field="fio1">Иванова</span>
    <span class="field field--fio field--fio2" data-field="fio2">Мария</span>
    <span class="field field--fio field--fio3" data-field="fio3">Сергеевна</span>
    <span class="field field--score" data-field="score">27</span>
    <span class="field field--regnum" data-field="regnum">000001</span>
  </div>
<script>
  /* демо-режим ?clean – без масок (когда фон чистый) */
  if (location.search.includes('clean')) document.getElementById('cert').classList.add('clean');
  /* демо-заполнение из JSON-подобного параметра:
     ?fio1=Иванова&fio2=Мария&fio3=Сергеевна&score=27&regnum=000001 */
  const p = new URLSearchParams(location.search);
  document.querySelectorAll('[data-field]').forEach(el => {
    const v = p.get(el.dataset.field);
    if (v !== null) el.textContent = el.dataset.field === 'regnum'
      ? String(v).replace(/\D/g, '').slice(-6).padStart(6, '0')
      : v.toUpperCase();
  });
</script>
</body>
</html>
